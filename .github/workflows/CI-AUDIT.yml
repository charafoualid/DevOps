name: CI Audit Service

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            audit-service/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install audit-service dependencies
        run: npm ci
        working-directory: audit-service

      - name: Run ESLint
        run: npm run lint
        working-directory: audit-service

      - name: Run tests
        run: npm test
        working-directory: audit-service