services:
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: devops
      MONGO_INITDB_ROOT_PASSWORD: devops123
    volumes:
      - mongo-data:/data/db
      - ./database/init.js:/docker-entrypoint-initdb.d/init.js:ro
  
  audit-mongo:
    image: mongo
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: audit
      MONGO_INITDB_ROOT_PASSWORD: audit123
    volumes:
      - audit-mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build: .
    ports:
      - "3000:12345"
    environment:
      PORT: 12345
      MONGO_URL: mongodb://devops:devops123@mongo:27017
      DB_NAME: local
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      - mongo
      - rabbitmq
  
  audit-service:
    build: ./audit-service
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      AUDIT_MONGO_URL: mongodb://audit:audit123@audit-mongo:27017
      AUDIT_DB_NAME: auditdb
    depends_on:
      - audit-mongo
      - rabbitmq

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
  
  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongo-data:
  audit-mongo-data:
  grafana-data: